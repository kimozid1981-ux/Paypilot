name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Core and server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PcoreOnly=true :core:jvmTest :server:test --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-reports, path: '**/build/reports/tests/' }

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PayPilot-android-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PayPilot-windows
          path: |
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/exe/*.exe

  ios:
    name: iOS (simulator build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: brew install xcodegen
      - run: cd iosApp && xcodegen generate
      - run: |
          cd iosApp
          xcodebuild -project PayPilot.xcodeproj -scheme PayPilot -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - run: cd iosApp/build/Build/Products/Debug-iphonesimulator && zip -r ../../../../PayPilot-ios-simulator.zip PayPilot.app
      - uses: actions/upload-artifact@v4
        with:
          name: PayPilot-ios-simulator
          path: iosApp/PayPilot-ios-simulator.zip
